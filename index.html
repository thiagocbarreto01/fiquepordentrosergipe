    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fique Por Dentro Sergipe" />
    <meta property="og:locale" content="pt_BR" />
    <!-- og:url e og:image são definidos por rota via react-helmet-async
         (NoticiaPage, Index etc.). Nada fixo aqui para não sobrescrever
         o og da notícia em crawlers que executam JS. -->


    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    
    

    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- JSON-LD: Veículo de notícias + Site -->

      "name": "Fique Por Dentro Sergipe",

    }
    </script>
    <script type="application/ld+json">

        "target": "/busca?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
