<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b91c1c" />
    <title>Fique Por Dentro Sergipe — Notícias de Sergipe, Aracaju, Brasil e Mundo</title>
    <meta name="description" content="Portal Fique Por Dentro Sergipe: cobertura em tempo real de Sergipe, Aracaju, política, polícia, denúncias, esportes, Brasil e mundo.">
    <meta name="author" content="Fique Por Dentro Sergipe" />
    <meta name="keywords" content="Fique Por Dentro Sergipe, notícias Sergipe, notícias Aracaju, política, polícia, denúncias, esportes, Brasil" />
    <!-- canonical é definido por rota via react-helmet-async (NoticiaPage etc.) -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fique Por Dentro Sergipe" />
    <meta property="og:locale" content="pt_BR" />
    <!-- og:url é definido por rota via react-helmet-async (NoticiaPage, Index etc.).
         Não fixar aqui — evita apontar notícias para a home. -->
    <!-- Nenhuma og:image fixa aqui — evita sobrescrever a og:image da notícia
         entregue pelo share-preview (Cloudflare Worker) para crawlers. -->
    <meta property="og:image" content="" data-lovable-og-suppressed="1" />
    <!-- og:image dinâmico:
         - Crawlers em /noticia/<slug> recebem HTML da edge function
           share-preview (via Cloudflare Worker) com og:image da matéria.
         - Demais rotas recebem og:image definido por rota via
           react-helmet-async (ex.: Index.tsx define og-default.jpg).
         Nenhuma og:image fixa aqui — evita sobrescrever o og:image da notícia. -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    
    

    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fique Por Dentro Sergipe" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- JSON-LD: Veículo de notícias + Site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "Fique Por Dentro Sergipe",
      "url": "/",
      "logo": "/favicon.png"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fique Por Dentro Sergipe",
      "url": "/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/busca?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <meta property="og:title" content="Fique Por Dentro Sergipe — Notícias de Sergipe, Aracaju, Brasil e Mundo">
  <meta name="twitter:title" content="Fique Por Dentro Sergipe — Notícias de Sergipe, Aracaju, Brasil e Mundo">
  <meta property="og:description" content="Portal Fique Por Dentro Sergipe: cobertura em tempo real de Sergipe, Aracaju, política, polícia, denúncias, esportes, Brasil e mundo.">
  <meta name="twitter:description" content="Portal Fique Por Dentro Sergipe: cobertura em tempo real de Sergipe, Aracaju, política, polícia, denúncias, esportes, Brasil e mundo.">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
